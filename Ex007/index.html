<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" onsubmit="cadastro()">
        <fieldset>
            <legend>Cadastro de Usuário</legend>
            <p>
                <label for="pNome">Primeiro Nome</label>
                <input type="text" id="pNome"
                required placeholder="Digite seu Nome">
            </p>
            <p>
                <label for="">Último Nome</label>
                <input type="text" name="uNome" id="" required>
            </p>

            <p>
                <label for="">Senha</label>
                <input type="password" name="" id="" required>
            </p>
            <p>
                <label for="">Sexo</label>
                <input type="radio" name="sexo" id="masc">
                <label for="masc">Masculino</label>
                <input type="radio" name="sexo" id="femi">
                <label for="femi">Feminino</label>
            </p>

            <Label>Possui alguma deficiência?</Label>
            <p>
                <input type="checkbox" name="" id="visao" value="Visão">
                <label for="visao" >Visão</label>
                <input type="checkbox" name="" id="audicao" value="Audição">
                <label for="audicao">Audiçao</label>
                <input type="checkbox" name="" id="fala" value="Fala">
                <label for="fala">Fala</label>
                
            </p>

            <p>
                <label for="">Data de Nascimento</label>
                <input type="date">
            </p>

            <p>
                <label for="">Foto de Perfil</label>
                <input type="file" name="" id="fotoPerfil">
            </p>

            <p>
                <label for="">E-mail</label>
                <input type="email" name="" id="">
            </p>
            <p>
                <label for="">Dúvidas</label>
                <textarea name="" id="" cols="30" rows="10" placeholder=""></textarea>
            </p>
            <p>
                <label for="">Raça</label>
                <select name="" id="">
                    <option value="">Pardo</option>
                    <option value="">Negro</option>
                    <option value="">Branco</option>
                    <option value="">Indigena</option>
                    <option value="">Amarelo</option>
                    <option value="">Calcaziano</option>
            </p>

                </select>
                <p>
                <input type="submit" value="Enviar">
                
            </p>
        </fieldset>
    </form>
    <div id="resultado"></div>
    <script src="script.js"></script>
    
</body>
</html>
